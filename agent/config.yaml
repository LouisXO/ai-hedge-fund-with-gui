# Pre-registered evaluation points for the paper books (docs/AGENT_PLAN.md §5.6; written 2026-09-23,
# two sessions into the paper record, before any book had a closed lot).
#
# Rule: no verdict on a book — keep, change, retire — before its evaluation point, whichever comes
# first. Until then the brief shows progress only (closed lots / target, days / target). A change to
# these numbers is a new pre-registration and must be dated here.
evaluate_at:
  long:
    n_closed_lots: 100        # ~ three full turns of the 30-slot book at a 38-session median hold
    or_date: 2027-06-30
  insider:
    n_closed_lots: 200        # the backtest's per-trade sd is ~9.6% (base run, 6,589 trades); 200 trades give a ~0.68% standard error
    or_date: 2027-06-30       # on the mean (corrected 2026-09-29, S48: the "1.1%" written here was about two standard errors)
  # S48 (2026-09-29), comment only — the key below is unchanged: the execution gap is measured against the opening
  # cross (agent/auction_basis.py), the evaluation's basis; the bars' open (model_px) is kept for reference. The paper
  # NAV that is compared is the auction basis with dividends, net of regulatory fees. agent/evaluate.py computes these
  # inputs every day into out/agent/evaluate.json only (no page headline before the evaluation point).
  metric: "alpha2 (SPY + size) of the paper NAV vs the same-window backtest; execution gap = mean fill vs model open"

# S47 (2026-09-29): the data correction took effect with the 2026-09-29 list (first fills at the 09-30 open).
# Evaluation counts only lots whose entry order's as_of is on or after this date (read by agent/brief.py).
evaluate_from: 2026-09-29
