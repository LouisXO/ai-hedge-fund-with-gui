# 公开层:纯静态,内容由本机每日生成并提交,Netlify 直接发布,无需构建。
[build]
  # base 显式设为仓库根:UI 里残留着 v1 的 "app/frontend",
  # 该目录在 v2-rebuild 上不存在,会让构建在读配置阶段就失败。
  base = "/"
  publish = "site/public"
  command = "echo 'prebuilt static site — nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 2026-09-23: the home page became the paper portfolio; the retired master-signal pages moved to /masters/
[[redirects]]
  from = "/2026-*"
  to = "/masters/2026-:splat"
  status = 301
