# Ledger rows the report collector cannot read (hedge_fund/validation/family_log.py; added 2026-10-20 for S54,
# docs/AGENT_PLAN.md "### S54 预注册" item 3: "Holm 账本 9/30 之后没重写:补上 S53、信号层试验和 S54").
#
# Every number below is the one §9 recorded (source: docs/AGENT_PLAN.md line numbers at commit 2ee01e9). Nothing
# here re-runs a test or changes a verdict; the ledger only counts what was tested.
#
#   family: signal       a signal-level test that never ran as a book (IC, event study, long-short deciles, option
#                        gates). n_trials = the trials §9 says the test ran; best_t = the largest |t| §9 reports, with
#                        its sign. The ledger shows p_group = min(1, n_trials x p(best_t)), the Bonferroni bound for the
#                        best of the group, and counts n_trials in the trial total that the deflated Sharpe uses.
#                        Signal tests that §9 counted +0 (S49 D2-D6 diagnostics, S50 and S52 descriptive records) and
#                        execution-layer tests that §9 keeps out of Holm (S31, S41) are not listed.
#   family: measurement  a registered measurement without a result yet: one trial in the total; t stays empty until
#                        it reads, and is then filled in here with its source line.
#
# S53's counted variant (composite_long_fpi) is a book: the collector reads it from its report's top-level `fpi`
# block (family_log.TOP_LEVEL), so it is not repeated here.
